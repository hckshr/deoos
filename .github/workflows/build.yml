name: Build and test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Leave a running job time to tear down its local RustFS volume.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.93.1'
  NODE_VERSION: '22.23.2'
  CARGO_BUILD_JOBS: '4'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
      - name: Resolve output directory
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          output = (Path(os.environ['GITHUB_WORKSPACE']).resolve() / 'outputs').resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'DEOOS_OUTPUTS_DIR={output.as_posix()}\n')
          PYTHON
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust formatting and lint
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --no-self-update
          cargo +"$RUST_VERSION" fmt --manifest-path engine/Cargo.toml --check
          cargo +"$RUST_VERSION" fmt --manifest-path bindings/node/Cargo.toml --check
          cargo +"$RUST_VERSION" clippy --locked --manifest-path engine/Cargo.toml -- -D warnings
          cargo +"$RUST_VERSION" clippy --locked --manifest-path bindings/node/Cargo.toml -- -D warnings
      - name: TypeScript and Python syntax
        run: |
          npm ci --prefix clients/typescript
          npm run build --prefix clients/typescript
          python -m compileall -q clients/python packaging tests examples
      - name: Build native artifacts for behavioral tests
        timeout-minutes: 30
        run: |
          python -m pip install -r tests/requirements.txt
          rustup override set "$RUST_VERSION"
          python packaging/build_package.py --build-only
      - name: Run both SDKs and deployment modes against RustFS
        timeout-minutes: 15
        env:
          ENGINE_BINARY: ${{ github.workspace }}/engine/target/release/deoos-server
        run: |
          docker compose up -d
          python - <<'PYTHON'
          import time, boto3
          s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:19000',
                            region_name='us-east-1', aws_access_key_id='local-development',
                            aws_secret_access_key='local-development-only-secret')
          for attempt in range(60):
              try:
                  s3.list_buckets()
                  break
              except Exception:
                  time.sleep(.5)
          else:
              raise RuntimeError('RustFS did not become ready')
          PYTHON
          python tests/two_modes.py rustfs
          python tests/storage_checks.py
          python tests/error_guide.py
          python tests/discovery_contract.py
          python tests/active_discovery_contract.py
          python packaging/build_package.py --package-only
          python -m pip install outputs/release/deoos-*/python/*.whl
          python tests/mcp_behavior.py --binary engine/target/release/deoos-server --backend rustfs --report outputs/evidence/mcp-rustfs.json
          python tests/dev_cli.py
      - name: Capture RustFS logs and remove its volume
        if: always()
        run: |
          mkdir -p outputs/evidence
          docker compose logs --no-color > outputs/evidence/rustfs.log 2>&1
          docker compose down -v
      - name: Upload behavioral evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEOOS_OUTPUTS_DIR }}/evidence/
            ${{ env.DEOOS_OUTPUTS_DIR }}/active-discovery/
          if-no-files-found: ignore
          retention-days: 14

  packages:
    needs: checks
    # Multi-platform package build. Manual only; pull requests and pushes run checks.
    # This job does not deploy and does not use cloud credentials.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            cpu: arm64
          - target: macos-x64
            runner: macos-15-intel
            cpu: x64
          - target: linux-x64
            runner: ubuntu-24.04
            cpu: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cpu: arm64
          - target: windows-x64
            runner: windows-2022
            cpu: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.cpu }}
      - name: Resolve output directory
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          output = (Path(os.environ['GITHUB_WORKSPACE']).resolve() / 'outputs').resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'DEOOS_OUTPUTS_DIR={output.as_posix()}\n')
          PYTHON
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.cpu }}
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Build Linux packages in audited glibc 2.28 images
        if: startsWith(matrix.target, 'linux-')
        timeout-minutes: 40
        run: python packaging/ci.py linux-build "${{ matrix.target }}"
      - name: Build native macOS and Windows packages
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        timeout-minutes: 40
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup override set "$RUST_VERSION"
          python packaging/build_package.py
          python packaging/ci.py verify "${{ matrix.target }}"
      - name: Test installed packages and filesystem crash recovery on Apple Silicon
        if: matrix.target == 'macos-arm64'
        timeout-minutes: 15
        run: |
          python tests/package_smoke.py --backend filesystem
          python tests/local_faults.py --binary engine/target/release/deoos-server --mounts
          python -m pip install outputs/release/deoos-*/python/*.whl
          python tests/mcp_behavior.py --binary engine/target/release/deoos-server --backend filesystem --faults --report outputs/evidence/mcp-filesystem.json
      - name: Remove the temporary build container
        if: always()
        timeout-minutes: 10
        run: python packaging/ci.py cleanup
      - name: Upload built packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deoos-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEOOS_OUTPUTS_DIR }}/release/deoos-*/
            ${{ env.DEOOS_OUTPUTS_DIR }}/release/deoos-*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload runtime and ABI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEOOS_OUTPUTS_DIR }}/evidence/
          if-no-files-found: ignore
          retention-days: 14
